# RUN: yaml2obj %s -o %t
# RUN: llvm-readobj --headers --relocs %t | FileCheck %s

# CHECK:      Format: elf32-lc2k
# CHECK-NEXT: Arch: lc2k
# CHECK-NEXT: AddressSize: 32bit

# CHECK:      Class: 32-bit (0x1)
# CHECK-NEXT: DataEncoding: LittleEndian (0x1)

# CHECK:      Type: Relocatable (0x1)
# CHECK-NEXT: Machine: EM_LC2K (0x3E7)

# CHECK:      Relocations [
# CHECK-NEXT:   Section (2) .rela.text {
# CHECK-NEXT:     0x0 R_LC2K_32 - 0x0
# CHECK-NEXT:     0x4 R_LC2K_NONE - 0x0
# CHECK-NEXT:     0x8 R_LC2K_20 - 0x0
# CHECK-NEXT:     0xC R_LC2K_20_PCPLUS1REL - 0x0
# CHECK-NEXT:   }
# CHECK-NEXT: ]

!ELF
FileHeader:
  Class:    ELFCLASS32
  Data:     ELFDATA2LSB
  Type:     ET_REL
  Machine:  EM_LC2K 
Sections:
  - Name: .text
    Type: SHT_PROGBITS
  - Name: .rela.text
    Type: SHT_RELA
    Info: .text
    Relocations:
      - Offset: 0x0
        Type: R_LC2K_32
      - Offset: 0x4
        Type: R_LC2K_NONE
      - Offset: 0x8
        Type: R_LC2K_20
      - Offset: 0xC
        Type: R_LC2K_20_PCPLUS1REL

